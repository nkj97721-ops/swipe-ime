name: build-swipe-ime
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Generate project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SwipeIme"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ime.swipe"
              compileSdk = 34

              defaultConfig {
                  applicationId = "ime.swipe"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="滑行输入法"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <service
                      android:name="ime.swipe.SwipeIme"
                      android:label="滑行输入法"
                      android:exported="true"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
                  <activity
                      android:name="ime.swipe.MainActivity"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          mkdir -p app/src/main/java/swipe/trail
          cat > app/src/main/java/swipe/trail/SwipeTrail.kt <<'EOF'
          package swipe.trail

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import ime.swipe.TrailParams
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.roundToInt

          /**
           * 滑行轨迹渲染 白色 参数见 TrailParams
           * 触摸: down / move / up   绘制: onDraw 末尾调用 draw 返回 true 时继续刷新
           */
          class SwipeTrail(private val density: Float, var params: TrailParams = TrailParams()) {
              private class Pt(val x: Float, val y: Float, val t: Long)

              private val pts = ArrayList<Pt>()
              private var upAt = 0L
              private var sx = 0f
              private var sy = 0f
              private val path = Path()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = Color.WHITE
                  // SRC 让新一段直接覆盖旧段 避免半透明叠加出现珠点
                  xfermode = PorterDuffXfermode(PorterDuff.Mode.SRC)
              }

              fun down(x: Float, y: Float, t: Long) {
                  pts.clear()
                  upAt = 0L
                  sx = x
                  sy = y
                  pts.add(Pt(x, y, t))
              }

              fun move(x: Float, y: Float, t: Long) {
                  val k = params.smooth
                  sx = sx * k + x * (1f - k)
                  sy = sy * k + y * (1f - k)
                  pts.add(Pt(sx, sy, t))
              }

              fun up(t: Long) {
                  upAt = t
              }

              /** 返回 true 表示动画未结束 调用方需继续刷新 */
              fun draw(c: Canvas, now: Long): Boolean {
                  if (pts.isEmpty()) return false
                  val p = params
                  val life = max(1f, p.life)
                  val extra = if (upAt > 0) (now - upAt) * (p.lift - 1f) else 0f
                  fun age(q: Pt): Float = (now - q.t) + extra
                  while (pts.isNotEmpty() && age(pts[0]) > life) pts.removeAt(0)
                  if (pts.size < 2) return pts.isNotEmpty() && upAt == 0L

                  val headPx = p.head * density
                  val glowPx = p.glow * density
                  val passes = if (glowPx > 0f) 2 else 1
                  val layer = c.saveLayer(null, null)
                  for (pass in 0 until passes) {
                      val isGlow = passes == 2 && pass == 0
                      for (i in 1 until pts.size) {
                          val q = pts[i]
                          val ax: Float
                          val ay: Float
                          if (i > 1) { ax = (pts[i - 1].x + q.x) / 2; ay = (pts[i - 1].y + q.y) / 2 } else { ax = pts[0].x; ay = pts[0].y }
                          val bx: Float
                          val by: Float
                          if (i < pts.size - 1) { bx = (q.x + pts[i + 1].x) / 2; by = (q.y + pts[i + 1].y) / 2 } else { bx = q.x; by = q.y }
                          val k = max(0f, 1f - age(q) / life)
                          var wd = headPx * (p.tail + (1f - p.tail) * k.pow(p.taper))
                          var a = p.opacity * k.pow(p.fade)
                          if (isGlow) {
                              wd += 2f * glowPx
                              a *= 0.35f
                          }
                          paint.strokeWidth = wd
                          paint.alpha = (255f * a).roundToInt().coerceIn(0, 255)
                          path.rewind()
                          path.moveTo(ax, ay)
                          path.quadTo(q.x, q.y, bx, by)
                          c.drawPath(path, paint)
                      }
                  }
                  c.restoreToCount(layer)
                  return true
              }
          }
          EOF
          mkdir -p app/src/main/java/ime/swipe
          cat > app/src/main/java/ime/swipe/Store.kt <<'EOF'
          package ime.swipe

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray

          class Store(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("ime", Context.MODE_PRIVATE)

              fun prefs(): SharedPreferences = sp

              fun getList(key: String, def: List<String>): MutableList<String> {
                  val s = sp.getString(key, null) ?: return def.toMutableList()
                  return try {
                      val a = JSONArray(s)
                      MutableList(a.length()) { a.getString(it) }
                  } catch (e: Exception) {
                      def.toMutableList()
                  }
              }

              fun getFloat(key: String, def: Float): Float = sp.getFloat(key, def)

              fun putFloat(key: String, v: Float) {
                  sp.edit().putFloat(key, v).apply()
              }

              fun putList(key: String, l: List<String>) {
                  sp.edit().putString(key, JSONArray(l).toString()).apply()
              }

              /** 键盘黑色背景不透明度 0 到 100 */
              var bgAlpha: Int
                  get() = sp.getInt("bg_alpha", 80)
                  set(v) {
                      sp.edit().putInt("bg_alpha", v).apply()
                  }

              /** 单手模式 0 关 1 左手 2 右手 */
              var hand: Int
                  get() = sp.getInt("hand", 0)
                  set(v) {
                      sp.edit().putInt("hand", v).apply()
                  }
          }
          EOF
          mkdir -p app/src/main/java/ime/swipe
          cat > app/src/main/java/ime/swipe/TrailParams.kt <<'EOF'
          package ime.swipe

          /** 滑行轨迹参数 颜色固定白色 */
          class TrailParams(val v: FloatArray = DEF.copyOf()) {
              val head: Float get() = v[0]          // 头部线宽 dp
              val opacity: Float get() = v[1] / 100f // 不透明度
              val tail: Float get() = v[2] / 100f   // 尾部线宽比例
              val life: Float get() = v[3]          // 存活时长 ms
              val fade: Float get() = v[4]          // 渐隐曲线
              val taper: Float get() = v[5]         // 变细曲线
              val glow: Float get() = v[6]          // 发光 dp
              val smooth: Float get() = v[7] / 100f // 跟手平滑
              val lift: Float get() = v[8]          // 抬手后渐隐倍速

              fun save(s: Store) {
                  for (i in v.indices) s.putFloat("tp" + i, v[i])
              }

              companion object {
                  val NAMES = arrayOf("头部线宽 dp", "不透明度 %", "尾部线宽 %", "存活时长 ms", "渐隐曲线", "变细曲线", "发光 dp", "跟手平滑 %", "抬手后渐隐倍速")
                  val MIN = floatArrayOf(1f, 0f, 0f, 100f, 0.3f, 0.3f, 0f, 0f, 1f)
                  val MAX = floatArrayOf(30f, 100f, 100f, 2000f, 8f, 8f, 20f, 98f, 10f)
                  val STEP = floatArrayOf(0.5f, 1f, 1f, 10f, 0.1f, 0.1f, 1f, 1f, 0.1f)
                  val DEF = floatArrayOf(16f, 30f, 0f, 150f, 0.3f, 2f, 0f, 0f, 8f)

                  fun load(s: Store): TrailParams {
                      val p = TrailParams()
                      for (i in p.v.indices) p.v[i] = s.getFloat("tp" + i, DEF[i])
                      return p
                  }
              }
          }
