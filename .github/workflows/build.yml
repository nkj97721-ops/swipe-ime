name: build-swipe-ime
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build lexicon
        run: |
          mkdir -p lexsrc app/src/main/assets
          fetch() {
            for b in main master; do
              curl -fsSL "https://raw.githubusercontent.com/iDvel/rime-ice/$b/cn_dicts/$1.dict.yaml" -o "lexsrc/$1.yaml" && return 0
            done
            return 1
          }
          fetch 8105
          fetch base
          fetch ext || echo "ext missing"
          python3 tools/mklex.py app/src/main/assets/lex.txt lexsrc/8105.yaml lexsrc/base.yaml lexsrc/ext.yaml
          n=$(wc -l < app/src/main/assets/lex.txt)
          echo "lexicon lines $n"
          test "$n" -gt 20000
      - name: Build
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeIme
          path: app/build/outputs/apk/debug/app-debug.apk
